<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#083F4A">
  <meta name="robots" content="noindex, nofollow">

  <title>Mila Peligrosa — Official Website</title>

  <meta
    name="description"
    content="The official website of Mila Peligrosa. Coming soon."
  >

  <style>
    :root {
      --dark: #083F4A;
      --turquoise: #00C9C3;
      --light-turquoise: #B5F2E8;
      --lemon: #F4F36A;
      --cream: #FFFCE6;
      --muted: #A3D4CE;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;

      background:
        radial-gradient(
          ellipse at 50% 40%,
          #148E92 0%,
          #075E69 45%,
          #083F4A 100%
        );

      color: var(--cream);
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 900px;
      padding: 60px 24px;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 5px;
      color: var(--light-turquoise);
      margin-bottom: 38px;
      text-transform: uppercase;
    }

    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(58px, 10vw, 130px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -4px;
    }

    h1 span {
      display: block;
      font-style: italic;
      color: var(--lemon);
    }

    .divider {
      width: 45px;
      height: 1px;
      background: var(--lemon);
      margin: 45px auto;
    }

    .subtitle {
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--light-turquoise);
    }

    .status {
      margin-top: 70px;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--lemon);
      text-transform: uppercase;
    }

    footer {
      position: absolute;
      bottom: 28px;
      width: 100%;
      text-align: center;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      h1 {
        letter-spacing: -2px;
      }

      .eyebrow {
        letter-spacing: 3px;
      }

      .subtitle {
        letter-spacing: 3px;
      }

      .status {
        margin-top: 55px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <p class="eyebrow">
      Official Artist Website
    </p>

    <h1>
      Mila
      <span>Peligrosa.</span>
    </h1>

    <div class="divider"></div>

    <p class="subtitle">
      Singer · Artist
    </p>

    <p class="status">
      Something is coming.
    </p>

  </main>

  <footer>
    © 2026 MILA PELIGROSA
  </footer>

</body>
</html>
