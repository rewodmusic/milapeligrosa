<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Mila Peligrosa candy-style instagram icon">
      <title>Instagram — Pink Bubblegum Icon</title>
      <desc>Glossy inflated hot pink Y2K 3D candy social icon with rich raspberry shadows and turquoise highlights. Transparent background.</desc>
      <defs>
    <radialGradient id="jelly" cx="31%" cy="18%" r="88%">
       <stop offset="0" stop-color="#ffccf4"/>
       <stop offset=".20" stop-color="#ff6fca"/>
       <stop offset=".50" stop-color="#ff23a2"/>
       <stop offset=".78" stop-color="#e71380"/>
       <stop offset="1" stop-color="#831046"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#ffe1f7"/>
      <stop offset=".35" stop-color="#ff71c9"/>
      <stop offset=".70" stop-color="#c91470"/>
      <stop offset="1" stop-color="#680d3c"/>
    </linearGradient>
    <linearGradient id="extrusion" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#cc177b"/>
      <stop offset=".55" stop-color="#9a1059"/>
      <stop offset="1" stop-color="#580a35"/>
    </linearGradient>
    <linearGradient id="groove" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#3b0631"/>
      <stop offset=".5" stop-color="#6a073d"/>
      <stop offset="1" stop-color="#9e0d5b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".93"/>
      <stop offset=".5" stop-color="#ffedfa" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".58" stop-color="#95fff3"/>
      <stop offset="1" stop-color="#17cdd7"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-30%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
<clipPath id="shapeClip"><path d="M139 55 C193 46 266 45 298 63 C324 78 339 103 341 143 C347 197 344 258 331 291 C316 324 282 337 237 341 C197 346 124 343 93 325 C64 308 54 276 55 237 C53 196 52 131 66 97 C81 67 109 60 139 55 Z"/></clipPath></defs>
      <ellipse cx="200" cy="350" rx="125" ry="23" fill="#4d082c" opacity=".28" filter="url(#shadow)"/>
      <path d="M139 55 C193 46 266 45 298 63 C324 78 339 103 341 143 C347 197 344 258 331 291 C316 324 282 337 237 341 C197 346 124 343 93 325 C64 308 54 276 55 237 C53 196 52 131 66 97 C81 67 109 60 139 55 Z" transform="translate(0,16)" fill="url(#extrusion)"/>
      <path d="M139 55 C193 46 266 45 298 63 C324 78 339 103 341 143 C347 197 344 258 331 291 C316 324 282 337 237 341 C197 346 124 343 93 325 C64 308 54 276 55 237 C53 196 52 131 66 97 C81 67 109 60 139 55 Z" fill="url(#rim)"/>
      <path d="M139 55 C193 46 266 45 298 63 C324 78 339 103 341 143 C347 197 344 258 331 291 C316 324 282 337 237 341 C197 346 124 343 93 325 C64 308 54 276 55 237 C53 196 52 131 66 97 C81 67 109 60 139 55 Z" transform="translate(0,-2) scale(1 .996)" fill="url(#jelly)" stroke="#ffb7e5" stroke-width="1.3"/>
      <g clip-path="url(#shapeClip)">
        <ellipse cx="258" cy="287" rx="122" ry="85" fill="#72033a" opacity=".25" filter="url(#soft)"/>
        <ellipse cx="154" cy="89" rx="101" ry="43" fill="#ffe7fa" opacity=".27" filter="url(#soft)"/>
        <path d="M94 147 C108 98 150 76 193 73 Q264 68 307 135" stroke="url(#shine)" stroke-width="18" stroke-linecap="round" fill="none" filter="url(#soft)" opacity=".55"/>
        <path d="M101 124 Q135 77 203 75" stroke="#fff5ff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".7"/>
        
        <!-- Puffy frame and sunken lens -->
        <rect x="121" y="120" width="160" height="161" rx="47" fill="none" stroke="#ffa7df" stroke-width="28" opacity=".65" transform="translate(0,-4)"/>
        <rect x="121" y="120" width="160" height="161" rx="47" fill="none" stroke="url(#groove)" stroke-width="21"/>
        <circle cx="201" cy="201" r="42" fill="#ffa5e0" opacity=".68"/>
