        <ellipse cx="116" cy="100" rx="7" ry="15" transform="rotate(26 116 100)" fill="#dcfffb" filter="url(#glow)" opacity=".7"/>
        <ellipse cx="116" cy="100" rx="3.8" ry="9.5" transform="rotate(26 116 100)" fill="url(#spark)"/>
        <ellipse cx="304" cy="225" rx="2.5" ry="6" transform="rotate(12 304 225)" fill="#a8fff5" opacity=".6"/>
