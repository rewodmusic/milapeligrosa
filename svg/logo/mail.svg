<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Mila Peligrosa candy-style mail icon">
      <title>Mail — Pink Bubblegum Icon</title>
      <desc>Glossy inflated hot pink Y2K 3D candy social icon with rich raspberry shadows and turquoise highlights. Transparent background.</desc>
      <defs>
    <radialGradient id="jelly" cx="31%" cy="18%" r="88%">
       <stop offset="0" stop-color="#ffccf4"/>
       <stop offset=".20" stop-color="#ff6fca"/>
       <stop offset=".50" stop-color="#ff23a2"/>
       <stop offset=".78" stop-color="#e71380"/>
       <stop offset="1" stop-color="#831046"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#ffe1f7"/>
      <stop offset=".35" stop-color="#ff71c9"/>
      <stop offset=".70" stop-color="#c91470"/>
      <stop offset="1" stop-color="#680d3c"/>
    </linearGradient>
    <linearGradient id="extrusion" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#cc177b"/>
      <stop offset=".55" stop-color="#9a1059"/>
      <stop offset="1" stop-color="#580a35"/>
    </linearGradient>
    <linearGradient id="groove" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#3b0631"/>
      <stop offset=".5" stop-color="#6a073d"/>
      <stop offset="1" stop-color="#9e0d5b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".93"/>
      <stop offset=".5" stop-color="#ffedfa" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".58" stop-color="#95fff3"/>
      <stop offset="1" stop-color="#17cdd7"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-30%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
<clipPath id="shapeClip"><path d="M118 80 C170 65 250 66 300 80 C329 88 341 114 341 153 L341 253 C341 291 321 314 289 326 C232 342 150 340 103 325 C73 314 57 289 57 252 L57 153 C57 116 76 92 118 80 Z"/></clipPath></defs>
      <ellipse cx="200" cy="350" rx="125" ry="23" fill="#4d082c" opacity=".28" filter="url(#shadow)"/>
      <path d="M118 80 C170 65 250 66 300 80 C329 88 341 114 341 153 L341 253 C341 291 321 314 289 326 C232 342 150 340 103 325 C73 314 57 289 57 252 L57 153 C57 116 76 92 118 80 Z" transform="translate(0,16)" fill="url(#extrusion)"/>
      <path d="M118 80 C170 65 250 66 300 80 C329 88 341 114 341 153 L341 253 C341 291 321 314 289 326 C232 342 150 340 103 325 C73 314 57 289 57 252 L57 153 C57 116 76 92 118 80 Z" fill="url(#rim)"/>
      <path d="M118 80 C170 65 250 66 300 80 C329 88 341 114 341 153 L341 253 C341 291 321 314 289 326 C232 342 150 340 103 325 C73 314 57 289 57 252 L57 153 C57 116 76 92 118 80 Z" transform="translate(0,-2) scale(1 .996)" fill="url(#jelly)" stroke="#ffb7e5" stroke-width="1.3"/>
      <g clip-path="url(#shapeClip)">
        <ellipse cx="258" cy="287" rx="122" ry="85" fill="#72033a" opacity=".25" filter="url(#soft)"/>
        <ellipse cx="154" cy="89" rx="101" ry="43" fill="#ffe7fa" opacity=".27" filter="url(#soft)"/>
        <path d="M94 147 C108 98 150 76 193 73 Q264 68 307 135" stroke="url(#shine)" stroke-width="18" stroke-linecap="round" fill="none" filter="url(#soft)" opacity=".55"/>
        <path d="M101 124 Q135 77 203 75" stroke="#fff5ff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".7"/>
        
        <!-- Dimensional envelope, violet recessed seam -->
        <rect x="105" y="141" width="191" height="136" rx="21" fill="#ff9cdb" opacity=".55" transform="translate(0,-4)"/>
        <rect x="105" y="141" width="191" height="136" rx="21" fill="none" stroke="url(#groove)" stroke-width="18"/>
        <path d="M113 155 L200 224 L288 155" fill="none" stroke="#ff9fdb" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity=".6" transform="translate(0,-4)"/>
        <path d="M113 155 L200 224 L288 155" fill="none" stroke="url(#groove)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M113 268 L162 227 M288 268 L237 227" fill="none" stroke="url(#groove)" stroke-width="12" stroke-linecap="round" opacity=".95"/>
        <path d="M122 154 L195 211" fill="none" stroke="#ff8bcf" stroke-opacity=".42" stroke-width="3" stroke-linecap="round"/>
        
        <ellipse cx="116" cy="100" rx="7" ry="15" transform="rotate(26 116 100)" fill="#dcfffb" filter="url(#glow)" opacity=".7"/>
        <ellipse cx="116" cy="100" rx="3.8" ry="9.5" transform="rotate(26 116 100)" fill="url(#spark)"/>
        <ellipse cx="304" cy="225" rx="2.5" ry="6" transform="rotate(12 304 225)" fill="#a8fff5" opacity=".6"/>
      </g>
      
    <path d="M299 92 Q303 109 320 114 Q302 119 297 135 Q292 120 276 114 Q293 109 299 92 Z" fill="#0fc8d4" opacity=".42" filter="url(#glow)"/>
    <path d="M299 97 Q303 110 314 114 Q302 118 298 130 Q294 118 281 114 Q294 111 299 97 Z" fill="url(#spark)"/>
    <circle cx="304" cy="114" r="2" fill="#fff"/>

    </svg>