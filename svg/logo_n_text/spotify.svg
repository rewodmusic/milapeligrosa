<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="350" viewBox="0 0 1030 350" role="img" aria-labelledby="candy-title candy-desc">
  <title id="candy-title">Candy Pink Spotify Logo and Wordmark</title>
  <desc id="candy-desc">A glossy inflated pink Spotify icon beside the equally glossy bubblegum-style Spotify lettering, with deep berry shadows and turquoise glints on a transparent background.</desc>
  <defs>

    <radialGradient id="wordCandy" cx="29%" cy="5%" r="102%">
      <stop offset="0" stop-color="#ffc2f0"/>
      <stop offset=".22" stop-color="#ff81dc"/>
      <stop offset=".48" stop-color="#ff39ac"/>
      <stop offset=".75" stop-color="#e21b88"/>
      <stop offset="1" stop-color="#981450"/>
    </radialGradient>
    <linearGradient id="wordOutline" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0" stop-color="#ffe0f5"/>
      <stop offset=".29" stop-color="#ff78d0"/>
      <stop offset=".7" stop-color="#cf1b78"/>
      <stop offset="1" stop-color="#780e40"/>
    </linearGradient>
    <linearGradient id="wordGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".79"/>
      <stop offset=".58" stop-color="#fff3fc" stop-opacity=".27"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="wordShadow" x="-20%" y="-40%" width="145%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="miniGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

